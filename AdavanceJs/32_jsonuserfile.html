<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        fetch("data.json",{
            method:"GET"
        })
        .then((data)=>{
            // json file array or object
            return data.json()
        })
        .then((data)=>{
            console.log(data)
            data.forEach((user) => {
                document.writeln(`<h2>id :${user.id} name : ${user.name} course : ${user.course} age : ${user.age}</h2>`)
            });
        })

    </script>
</body>
</html>
