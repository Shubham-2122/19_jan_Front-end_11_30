<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: lightcoral;
          height: 400px;
            display: flex;
            justify-content: start;
            justify-content: center;
            /* justify-content: end; */
            align-items: center;
            /* align-items: end; */
        }
        .box{
            height: 200px;
            width: 200px;
            border: 2px solid;
        }
        .main1{
            display: flex;
            height: 400px;
            background: lightgreen;
            /* flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse; */
            align-items: center;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;
        }
        #box2{
            align-content: center;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- flex : row or col  -->
    <!-- grid : row and col -->

    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <div class="main1">
        <div class="box">1</div>
        <div class="box" id="box2">2</div>
        <div class="box">3</div>
    </div>

</body>

</html>
