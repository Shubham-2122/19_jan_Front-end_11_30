<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* *{
            margin: ;
        } */
        nav{
            display: flex;
            background: lightcoral;
            justify-content: space-between;
            align-items: center;
        }
        ul li{
            display: inline-block;
            padding: 10px 20px;
            
        }
        a{
            color: black;
            text-decoration: none;
            font-size: 20px;
        }
        #sec1{
            display: flex;
            background: aquamarine;
        }
        .box{
            width: 25%;
            height: 300px;
            border: 2px solid;
        }
        #sec2{
            display: flex;
        }
        .box1{
            height: 300px;
            width: 33.33%;
            border: 2px solid;
        }

        #box2{
            display: flex;
            flex-direction: row;
        }
        .left,.right{
            width: 50%;
            height: 300px;
            border: 2px solid gray;
        }
        #box3{
            display: flex;
            flex-direction: column;
        }
        .top,.bottom{
            height: 50%;
            width: 100%;
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            logo
        </div>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="">Help</a></li>
        </ul>
        <div class="icons">icons</div>
    </nav>

    <section id="sec1">
        <div class="box">1</div>
        <div class="box" id="box2">
            <div class="left">left</div>
            <div class="right">right</div>
        </div>
        <div class="box" id="box3">
            <div class="top">top</div>
            <div class="bottom">bottom</div>
        </div>
        <div class="box">4</div>
    </section>

    <section id="sec2">
        <div class="box1">1</div>
        <div class="box1">2</div>
        <div class="box1">3</div>

    </section>
</body>
</html>
