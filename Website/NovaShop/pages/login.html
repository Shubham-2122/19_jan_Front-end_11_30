<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .login-card {
            max-width: 450px;
            margin: 100px auto;
            padding: 3rem;
            border-radius: 30px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--light-bg);
            color: var(--text-main);
        }
    </style>
</head>

<body style="background: linear-gradient(135deg, #f8fafc, #e2e8f0);">
    <div class="login-card glass-effect scale-in">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p class="text-muted" style="text-align: center; margin-bottom: 2.5rem;">Enter your credentials to access your
            account.</p>

        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Sign
                In</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
            Don't have an account? <a href="#" style="color: var(--primary-color); font-weight: 600;">Create one</a>
        </p>
    </div>
    <script src="../js/darkmode.js"></script>
</body>

</html>
